project:
  name: study3_supplemental_random_baseline
  phase: blind_supplemental_collection
  confirmatory_use: supplemental_only
environment:
  name: textworldexpress
  version: 1.1.0
  game_name: cookingworld
  game_fold: test
  game_params: numLocations=3,numIngredients=2,numDistractorItems=0,includeDoors=0,limitInventorySize=0
  maximum_steps: 50
model:
  provider: qwen
  service: alibaba_cloud_model_studio
  exact_model_id: qwen3.7-plus-2026-05-26
  api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  api_key_environment_variable: DASHSCOPE_API_KEY
  keychain_service: dimensional-dashscope-api-key
  thinking_mode: enabled
  reasoning_effort: null
  temperature: 0.0
  top_p: null
  experimental_context_limit_tokens: 131072
  max_output_tokens: 2048
  request_timeout_seconds: 120
  max_api_retries: 2
  minimum_request_interval_seconds: 0.0
agent:
  prompt_version: study3_v3_2_numbered_zero_based_v1
  action_selection_mode: numbered_index
  action_order: lexicographic
  history_window_steps: 20
  target_specification_mode: materialised_cookbook_equal_all_conditions
  experience_block: explicit_in_all_conditions
  empty_final_repair:
    enabled: true
    trigger: empty_content_only
    max_calls_per_step: 1
    prompt_version: numbered_empty_final_repair_v0.1
    thinking_mode: disabled
    reasoning_effort: null
    temperature: 0.0
    max_output_tokens: 16
experience:
  interface_version: study3_v3_2_canonical_raw_trajectory_v1
  inventory: study3_supplemental_random_baseline/formal/combined_inventory.jsonl
  renderer: study3_v3_2_raw_trajectory_v1
  condition_labels_visible_to_agent: false
  transfer_instructions: false
budget:
  pricing:
    cache_hit_input_per_million_usd: 0.16
    cache_miss_input_per_million_usd: 1.6
    output_per_million_usd: 1.6
